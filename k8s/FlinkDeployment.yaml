apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: luftdaten-job
spec:
  image: luftdaten-flink:local

  flinkVersion: v1_19

  serviceAccount: flink

  jobManager:
    resource:
      memory: "1024m"
      cpu: 1

  taskManager:
    resource:
      memory: "4096m"
      cpu: 4

  job:
    jarURI: local:///opt/flink/usrlib/luftdaten-flink-0.1.jar
    entryClass: com.yourname.luftdaten.jobs.Q5SlidingWindowExtendedAverageFilter
    args:
      - "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
      - "bid"
      - "rtracker"
      - "9000"
    parallelism: 2
    upgradeMode: last-state

  # /opt/flink/checkpoints must resolve to the same directory in both the
  # JobManager and TaskManager pods, and survive the pod deletion that a
  # last-state rescale does -- otherwise the new pod finds no checkpoint to
  # resume from and silently falls back to a stateless restart. Minikube is
  # single-node, so a hostPath on the node (same pattern as the datagen
  # dataset mount in DatagenJob.yaml) gives every pod that lands on it the
  # same underlying directory without needing a PVC/StorageClass.
  #
  # Kubernetes always creates a `DirectoryOrCreate` hostPath as root:root
  # 0755, but the Flink image's entrypoint drops from root to the `flink`
  # user (uid 9999) via gosu before starting the JVM. As "other", that user
  # has no write bit on a root-owned 0755 directory, so FileSystemJobResultStore's
  # mkdirs() fails silently (Flink logs "Created ... directory" unconditionally,
  # without checking the result) and the JobManager then crash-loops on
  # "The base directory of the JobResultStore isn't accessible". The
  # initContainer below chowns the mount to 9999:9999 first so the main
  # container's normal non-root user can actually write to it.
  podTemplate:
    spec:
      initContainers:
        - name: fix-checkpoint-dir-owner
          image: luftdaten-flink:local
          command: ["sh", "-c", "chown -R 9999:9999 /opt/flink/checkpoints"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: checkpoints
              mountPath: /opt/flink/checkpoints
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: checkpoints
              mountPath: /opt/flink/checkpoints
      volumes:
        - name: checkpoints
          hostPath:
            path: /home/docker/flink-checkpoints/
            type: DirectoryOrCreate

  flinkConfiguration:
    execution.checkpointing.interval: "30s"
    execution.checkpointing.storage: filesystem
    high-availability.type: kubernetes
    high-availability.storageDir: file:///opt/flink/checkpoints/ha
    state.checkpoints.dir: file:///opt/flink/checkpoints
    state.backend: hashmap

    rest.profiling.enabled: "true"

    taskmanager.numberOfTaskSlots: "4"

    job.autoscaler.enabled: "true"
    job.autoscaler.scaling.enabled: "true"

    # target utilization
    job.autoscaler.target.max: "0.8"
    job.autoscaler.target.min: "0.3"

    # stabilize scaling decisions
    job.autoscaler.stabilization.interval: "30s"
    job.autoscaler.metrics.window: "1m"
    job.autoscaler.scaling.interval: "30s"
    job.autoscaler.max-parallelism: "8"
    job.autoscaler.scale-down.interval: "30s"
