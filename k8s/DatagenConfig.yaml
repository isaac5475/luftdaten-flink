apiVersion: v1
data:
  config.kafka.yaml: |
    data_rate: 10
    period: 1000
    chunk_size: 1000

    pattern:
      - type: uniform
      #- fraction: 0.5
      #- distribution: 0.5

    data_source:
      type: "csv"
      file: "data/smart_water/data.csv"
      #type: "image_folder"
      #file: "/app/data/img"
      #encoding: "base64"

    duration: 60
    host: "0.0.0.0"
    ports:
      - 8080
      - 8081
      - 8082

    mqtt:
      enabled: false
      host: "mosquitto"
      port: 1883
      topic: "bid"

    kafka:
      enabled: true
      brokers: "kafka:9092"
      topic: "bid"
      flush_timeout_ms: 10000

    zipf:
      period_ms: 1000
      s: 1.4
      stochastic: true
  config.mqtt.yaml: |
    data_rate: 1
    period: 1000
    chunk_size: 1000

    pattern:
      - type: burst
      - fraction: 0.5
      - distribution: 0.5

    data_source:
      type: "image_folder"
      file: "/app/data/img"
      encoding: "base64"

    duration: 60
    host: "0.0.0.0"
    ports:
      - 8080
      - 8081
      - 8082

    mqtt:
      enabled: true
      host: "mosquitto"
      port: 1883
      topic: "bid"

    zipf:
      period_ms: 1000
      s: 1.4
      stochastic: true
  config.yaml: |
    data_rate: 100
    period: 1000
    chunk_size: 1000

    pattern:
      - type: burst
      - fraction: 0.7
      - distribution: 0.3

    data_source:
      type: "csv"
      file: "data/2020-01_bme280_trimmed.csv"
      #type: "image_folder"
      #file: "/app/data/img"
      #encoding: "base64"

    duration: 60000
    host: "0.0.0.0"
    ports:
      - 9090
      - 9091
    #  - 8082

    mqtt:
      enabled: false
      host: "mosquitto"
      port: 1883
      topic: "bid"

      kafka:
        enabled: true
        brokers: "localhost:9092"
        topic: "bid"

    zipf:
      period_ms: 1000
      s: 1.4
      stochastic: true
kind: ConfigMap
metadata:
  name: datagen-config
  namespace: default
